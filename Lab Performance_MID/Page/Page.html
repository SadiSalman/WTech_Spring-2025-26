<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product Management Page</title>
    <link rel="stylesheet" href="../Design/Style.css">
    <script src="../JS/Validation.js"></script>
</head>
<body>
    <form id="productForm">
        <fieldset>
            <legend>Product Management Page</legend>

            <label for="unitPrice">Unit Price:</label>
            <input type="text" id="unitPrice" value="1000" readonly>

            <label for="quantity">Quantity Per Day:</label>
            <input type="number" id="quantity" name="quantity" placeholder="Enter quantity per day">
            <p id="errorMsg" class="error"></p>

            <label for="totalPrice">Total Price for 30 Days:</label>
            <input type="text" id="totalPrice" name="totalPrice" value="0" readonly>
        </fieldset>
    </form>
</body>
</html>
